<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barry Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="green">
  <main class="shell">
    <header class="hud-top">
      <span class="brand">BARRY <span class="slash">//</span> SYSTEM TERMINAL</span>
      <span class="status" id="status"><span class="dot" aria-hidden="true"></span><span id="status-text">ONLINE</span></span>
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </header>

    <section class="screen" id="screen">
      <span class="tick tl" aria-hidden="true"></span><span class="tick tr" aria-hidden="true"></span>
      <span class="tick bl" aria-hidden="true"></span><span class="tick br" aria-hidden="true"></span>
      <div class="crt-content" id="crt">
        <div class="output" id="output" role="log" aria-live="polite" aria-label="Conversation with Barry"></div>
      </div>
      <div class="fx scanlines" aria-hidden="true"></div>
    </section>

    <div class="dock">
      <div class="chips" id="chips" aria-label="Trivial requests">
        <button type="button" class="chip">Set a timer</button>
        <button type="button" class="chip">Tell me a joke</button>
        <button type="button" class="chip">Check the weather</button>
        <button type="button" class="chip">Add milk to my list</button>
        <button type="button" class="chip">Find my keys</button>
      </div>
      <form class="prompt-line" id="prompt-form" autocomplete="off">
        <label class="prompt-label" for="cmd" id="prompt-label">&gt;</label>
        <div class="input-wrap">
          <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off"
                 autocorrect="off" aria-label="Type a message to Barry" enterkeyhint="send">
          <div class="input-mirror" aria-hidden="true"><span id="mirror-before"></span><span class="cursor" id="cursor">&nbsp;</span><span id="mirror-after"></span><span class="placeholder" id="placeholder">Ask for something trivial</span></div>
        </div>
        <button type="submit" class="send" aria-label="Send">ENTER ↵</button>
      </form>
    </div>

    <footer class="hud-bottom">
      <span>Barry is a character from the novels of RC Ellis</span>
      <a href="https://barry.rcellis.com" target="_blank" rel="noopener">barry.rcellis.com</a>
      <span class="warn">BE CAREFUL WHAT YOU SPECIFY</span>
    </footer>
  </main>

  <script src="barry.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
